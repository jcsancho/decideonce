[project]
name = "decideonce"
version = "0.1.1"
description = "Learn the decisions inside agent workflows and hand confident ones to hosted Jev"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jose Carlos Sancho"}]
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "pydantic",
    "jsonschema",
    "cryptography",
]

[project.scripts]
decideonce = "decideonce.server:main"
decideonce-gateway = "decideonce.gateway:main"

[project.urls]
Homepage = "https://github.com/jcsancho/decideonce"
Repository = "https://github.com/jcsancho/decideonce"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
markers = ["cookbook: needs the local cookbook venv (offline row checks)"]

[tool.hatch.build.targets.wheel]
packages = ["decideonce"]
