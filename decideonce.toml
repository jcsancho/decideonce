# Default config for decideonce. Path from DECIDEONCE_CONFIG.
# Every default below is a config value: change the config, not the code.

[store]
data_dir = "~/.decideonce"
project = "default"
max_rows_per_point = 50000

[decider]
# "tiered" is the default: hosted Jev answers from shadow on, no training
# step (key_ref + monthly_budget_usd below). "fake" is scripted fakes for
# offline tries. Pre-M12 configs with backend = "local_legacy" or a [jev]
# section are refused at startup: remove [jev]; set backend = "tiered".
backend = "tiered"  # "tiered" | "fake"
timeout_s = 3

[hosted_jev]
url = "https://openrouter.ai/api/v1/systemone"
model = "typesafe/jev-1.13"
key_ref = ""
price_per_mtok_in = 0.042
monthly_budget_usd = 0
fit_rows = 200
min_private_gain = 0.05
min_compare = 100
redemote_window_days = 30
pack = false  # true is refused at startup (one request per point)
reserve_usd = 0.0005
fake_accuracy = 1.0

[analyze]
min_group = 20
weights = {R2 = 2, R3 = 2, R4_high = 2, R4_mid = 1, R5 = 1, R6 = -1, R8 = 1}
good_fit = 6
possible = 3

[discovery]
# Call-name suffixes the static detector treats as LLM calls.
llm_calls = ["chat", "complete", "completions.create", "messages.create",
             "do_decide", "invoke", "generate"]
# Min share of runs (with a later step) whose later input/branch consumes the
# output for a trace group to count as a behaviour candidate.
min_consumed = 0.8

[train]
min_train = 60
min_examples = 200
min_per_option = 5
holdout = 0.25
calib = 0.15
teacher_only_weight = 1.0
teacher_alarm = 0.10

[fireworks]
url = "https://api.fireworks.ai"
key_ref = ""
monthly_budget_usd = 0  # 0 = no billed Fireworks call of any kind; setting it is the spending approval
allow_paid_training = false
smoke_examples = 32
epochs = 2
train_price_per_mtok = 5.86
eval_price_per_decision = 0.0012
# M11: the pinned cookbook runs as a child process (GP1). Empty cookbook_dir
# disables the live trainer; set it to a clone at cookbook_commit.
cookbook_dir = ""
cookbook_commit = "57968a2"
batch_rows = 24  # recipe --batch-size counts rows (GP2)
lora_rank = 64
learning_rate = 0.0001
base_model = "accounts/fireworks/models/muse-glimmer-30b"  # informational: the recipe default
job_max_hours = 3  # detached jobs past this are killed (GP2)
worker_idle_min = 30  # scoring sessions close after this long idle (GP6)
score_price_per_mtok = 1.96  # prefill-rate assumption, unverified until L3 (GP12)
reserve_usd = 0.005  # per-call scoring reservation under tier fireworks (GP12)
allow_session_serving = false  # live private shadow/serve needs this + L3 + written OK (GP11)

[autopilot]
enabled = false  # default off: v1.8 behaviour unchanged
points = []  # point ids or globs allowed on autopilot, e.g. ["refund.*"]; [] = none
max_target_error = 0.02
auto_serve = true
auto_train = true
max_job_usd = 0.0  # 0 = autopilot never trains
max_monthly_jobs_usd = 0.0
min_new_rows = 100
free_training_until = ""  # set only after the user checked the smoke job was not billed
cooldown_days = 7
check_interval_min = 10
notify_cmd = ""  # e.g. ["notify-send"]; run with a one-line message appended, no shell

[autopilot_trust]
public_key = ""  # set by `decideonce autopilot keygen` (base64 Ed25519)

[serve]
target_error = 0.02
min_auto_support = 30
min_coverage = 0.20
min_margin_vs_random = 0.02
min_option_recall = 0.8
min_shadow = 30
audit_rate = 0.10
drift_window = 100
allow_auto_irreversible = false

[gateway]
host = "127.0.0.1"
port = 8787
local_token = ""
upstreams = {openai = "https://api.openai.com", anthropic = "https://api.anthropic.com"}
log_unmatched = false
log_allow = []
trace_data_class = "private"
trace_retention_days = 30
point_retention_days = 90
min_template_chars = 40
template_min_match = 0.95
max_state_chars = 8000
format_min_n = 200
format_match_min = 0.97
max_unparsed = 0.02
jev_timeout_s = 5
upstream_timeout_s = 120

[extract]
audit_rate = 0.2
min_audited = 30
min_agreement = 0.9
weight = 0.5
transcript_retention_days = 90

[plan]
min_at_start = 0.9
target_error = 0.02
min_shadow = 30
audit_rate = 0.10
max_quality_drop = 0.05
trial_looks = [60, 120, 200, 400]
trial_z = 2.36
pair_timeout_h = 24
downgrade_audit_rate = 0.2
monitor_window = 120
monitor_min_pairs = 30
allow_pilot_force = false
check_timeout_s = 30
